<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widget RX27</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0C0F13;color:#EEF1F5;font:16px/1.45 -apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:420px;display:grid;gap:16px}h1{font-size:34px;margin:0;letter-spacing:-.02em}h1 b{color:#8FA8FF}
button{all:unset;cursor:pointer;text-align:center;padding:18px;border-radius:16px;background:#8FA8FF;color:#0C0F13;font-weight:700;font-size:18px}
button:active{transform:scale(.98)}ol{margin:0;padding-left:20px;color:#b9c1cf}li{margin:6px 0}.ok{color:#5FE0B0;min-height:22px}</style></head>
<body><main><h1>RX<b>/</b>27 · Widget</h1>
<button id="c" type="button">Copiar código del widget</button><div class="ok" id="m" aria-live="polite"></div>
<ol><li>Pulsa el botón de arriba.</li><li>Abre <b>Scriptable</b> y pulsa <b>+</b> (arriba a la derecha) para crear un script nuevo y vacío.</li><li>Mantén pulsado dentro y <b>Pegar</b>. Ponle de nombre <b>RX27</b>.</li><li>Pulsa ▶︎ y pega el ID de tu Gist cuando te lo pida.</li></ol></main>
<script>
let code="";fetch("rx27-widget.js",{cache:"no-store"}).then(r=>r.text()).then(t=>code=t);
document.getElementById("c").onclick=async()=>{const m=document.getElementById("m");try{if(!code)code=await (await fetch("rx27-widget.js")).text();await navigator.clipboard.writeText(code);m.textContent="✓ Copiado ("+code.split("\n").length+" líneas). Ahora ve a Scriptable."}catch(e){m.textContent="No se ha podido copiar. Vuelve a pulsar."}};
</script></body></html>
